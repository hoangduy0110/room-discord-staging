[package]
name = "room-discord-rs"
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
description = "Supervised Discord user-token voice room keeper"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
rand = "0.8"
rand_distr = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
davey = { git = "https://github.com/Snazzah/davey", package = "davey", rev = "a1e2e741bea06bc3b7167a5c3792844b8975993c" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
serial_test = "3"